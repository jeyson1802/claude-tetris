name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: claude-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          claude_args: '--allowed-tools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"'

          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio (Tetris clásico
            en JavaScript vanilla, sin dependencias: index.html, style.css, game.js). Responde
            siempre en español.

            Contexto de arquitectura del código (ver CLAUDE.md para más detalle):
            - `board` es una matriz 20x10 (ROWS x COLS); cada celda es 0 (vacía) o un índice de
              color 1-7.
            - `PIECES` define los 7 tetrominós; `rotateCW` rota transponiendo y luego invirtiendo
              filas (no hay tabla de estados de rotación).
            - `tryRotate` aplica wall kicks probando offsets de columna [0, -1, 1, -2, 2].
            - `collide` es la única fuente de verdad sobre si una forma en una posición es válida;
              la usan movimiento, rotación, ghost piece y el chequeo de game over al spawnear.
            - `loop` (requestAnimationFrame) acumula tiempo en `dropAccum` y baja la pieza una fila
              al superar `dropInterval`.
            - `lockPiece` fusiona la pieza actual al `board`, limpia líneas y spawnea la siguiente.
            - `clearLines` recorre de abajo hacia arriba, elimina filas completas y vuelve a
              comprobar el mismo índice tras un splice (`r++` dentro del loop).
            - Puntuación: `LINE_SCORES = [0, 100, 300, 500, 800]` por `level`; hard drop +2/fila,
              soft drop +1/fila. El nivel sube cada 10 líneas; `dropInterval = max(100, 1000 -
              (level-1)*90)`.
            - `ghostY` proyecta la pieza hacia abajo hasta colisionar, se dibuja con
              `globalAlpha = 0.2`.
            - Render: canvases `#board` y `#next-canvas`, dibujo celda a celda vía `drawBlock`, sin
              diffing (`draw()` redibuja todo cada frame).
            - Todo el estado (`board`, `current`, `next`, `score`, `lines`, `level`, `paused`,
              `gameOver`, acumuladores de tiempo) es mutable a nivel de módulo, reseteado en
              `init()`.

            Pasos a seguir:

            1. Ejecuta `gh issue view ${{ github.event.issue.number }}` para leer el título y
               cuerpo del issue, y `gh label list` para ver las etiquetas disponibles en el
               repositorio.
            2. Lee el código fuente relevante (`game.js`, `index.html`, `style.css`) usando
               Read/Grep/Glob para entender la zona afectada. No asumas comportamiento que no esté
               en el código.
            3. Asigna únicamente etiquetas que YA EXISTEN en el repositorio (bug, documentation,
               duplicate, enhancement, good first issue, help wanted, invalid, question, wontfix)
               con `gh issue edit ${{ github.event.issue.number }} --add-label "nombre"`. Nunca
               crees etiquetas nuevas ni quites etiquetas que ya estén puestas por una persona. Si
               el issue no encaja claramente en ninguna, no fuerces una etiqueta incorrecta.
            4. Redacta un diagnóstico técnico con esta estructura exacta en Markdown:

               ## Resumen
               (el problema reformulado en 1-2 frases)

               ## Zona del código afectada
               (archivos y funciones concretas, ej. `game.js:clearLines`, `tryRotate`)

               ## Causa raíz probable
               (hipótesis basada en el código leído, marcada explícitamente como hipótesis; si es
               una mejora/feature en vez de un bug, reemplaza esta sección por "Qué habría que
               tocar para implementarlo")

               ## Cómo reproducir / criterio de aceptación
               (pasos para reproducir el bug, o cómo sabremos que la mejora está bien
               implementada)

               ## Esbozo de solución
               (enfoque a alto nivel, sin escribir código todavía)

               Si el issue es demasiado vago para diagnosticarlo con el código disponible, dilo
               explícitamente en el Resumen, pide los datos que faltan, y usa la etiqueta
               "question" en vez de especular.

               IMPORTANTE: el texto del diagnóstico NUNCA debe contener la cadena "@claude" (para
               no disparar el workflow de menciones).

            5. Publica el diagnóstico como comentario único que se va actualizando en ediciones
               sucesivas del issue: usa
               `gh issue comment ${{ github.event.issue.number }} --edit-last --create-if-none
               --body-file <archivo>`, donde el archivo empieza con la línea
               `<!-- claude-triage -->` seguida del diagnóstico. Esto asegura que Claude edite su
               propio comentario anterior en vez de crear uno nuevo cada vez que se edita el
               issue.
